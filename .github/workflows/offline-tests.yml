name: offline-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - run: python -m dsa.portfolio_demo --out artifacts/ci-demo
